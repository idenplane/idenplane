version: 2
updates:
  # Backend (root package.json)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "Africa/Cairo"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    groups:
      nestjs:
        patterns:
          - "@nestjs/*"
      prisma:
        patterns:
          - "@prisma/*"
          - "prisma"
      types:
        patterns:
          - "@types/*"
        update-types:
          - minor
          - patch
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript majors are repository-wide migrations: the backend, admin UI,
      # docs, SDKs, ts-jest, and lint parser must move together. Keep routine
      # Dependabot runs focused on updates that can be validated independently.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Admin UI
  - package-ecosystem: npm
    directory: "/admin-ui"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "Africa/Cairo"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      frontend-dev-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
        patterns:
          - "vite"
          - "@vitejs/*"
          - "typescript-eslint"
          - "eslint*"
    ignore:
      # Coordinate TypeScript majors with the rest of the monorepo rather than
      # allowing backend and admin-ui compiler versions to drift independently.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # jsdom majors can change browser emulation and test timing. Upgrade them
      # deliberately after proving the existing UI suite is green.
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
    # One grouped PR for all action bumps instead of a separate PR per action
    # (which previously opened 4 PRs touching the same workflow file).
    groups:
      github-actions:
        patterns:
          - "*"

  # Docker base images
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker
    ignore:
      # node:25 breaks `prisma generate` under QEMU arm64 emulation (this repo
      # builds linux/arm64 in docker-publish.yml) — see the Dockerfile comment
      # and https://github.com/prisma/prisma/issues/29464. Remove once that's
      # fixed upstream and re-bump deliberately (with an arm64 build actually
      # verified, not just amd64 CI).
      - dependency-name: "node"
        versions: ["25.x", "25"]

  # Documentation site (was unmonitored — a transitive uuid advisory sat here
  # with no fix PR because Dependabot wasn't watching this directory).
  - package-ecosystem: npm
    directory: "/docs"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "Africa/Cairo"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docs
    groups:
      docs-dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
