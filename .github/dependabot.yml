version: 2
updates:
  # Backend (root package.json)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "Africa/Cairo"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    groups:
      nestjs:
        patterns:
          - "@nestjs/*"
      prisma:
        patterns:
          - "@prisma/*"
          - "prisma"
      types:
        patterns:
          - "@types/*"
        update-types:
          - minor
          - patch
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript 7 cannot install here at all: ts-jest's peer range is
      # `>=4.3 <7` and 29.4.12 is its latest release, so `npm ci` dies with
      # ERESOLVE before a single test runs. That is what killed #1369 — not
      # our code. Re-proposing the same major every week just re-runs the
      # whole matrix to fail identically.
      # Remove this once ts-jest ships a release accepting TypeScript 7, and
      # do that bump deliberately with the toolchain moved in the same PR.
      - dependency-name: "typescript"
        update-types:
          - version-update:semver-major

  # Admin UI
  - package-ecosystem: npm
    directory: "/admin-ui"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "Africa/Cairo"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
    ignore:
      # Same wall as the root, different package holding it up: typescript-eslint
      # 8.67.0 (its latest) peers on `>=4.8.4 <6.1.0`, so TypeScript 7 fails
      # `npm ci` with ERESOLVE here too — that is what killed #1362. Note the
      # ceiling is 6.1, not 7: even a TypeScript 6.1 minor would trip it, so
      # revisit this pin rather than assuming only majors are affected.
      # Remove once typescript-eslint widens its peer range.
      - dependency-name: "typescript"
        update-types:
          - version-update:semver-major

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
    # One grouped PR for all action bumps instead of a separate PR per action
    # (which previously opened 4 PRs touching the same workflow file).
    groups:
      github-actions:
        patterns:
          - "*"

  # Docker base images
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker
    ignore:
      # node:25 breaks `prisma generate` under QEMU arm64 emulation (this repo
      # builds linux/arm64 in docker-publish.yml) — see the Dockerfile comment
      # and https://github.com/prisma/prisma/issues/29464. Remove once that's
      # fixed upstream and re-bump deliberately (with an arm64 build actually
      # verified, not just amd64 CI).
      - dependency-name: "node"
        versions: ["25.x", "25"]

  # Documentation site (was unmonitored — a transitive uuid advisory sat here
  # with no fix PR because Dependabot wasn't watching this directory).
  - package-ecosystem: npm
    directory: "/docs"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "Africa/Cairo"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docs
    groups:
      docs-dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  # Examples — these are the copy-paste starting point we hand new users, so a
  # stale lockfile here is a vulnerable dependency we actively ship. Neither
  # directory was watched until #1441: nanoid sat at 3.3.16 with no version
  # update PR, and because ci.yml gated on `npm audit` the resulting advisory
  # turned 11 of 13 open PRs red without a line of code changing.
  - package-ecosystem: npm
    directory: "/examples/nextjs-quickstart"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "Africa/Cairo"
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - examples
    groups:
      example-dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/examples/vanilla-js-quickstart"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "Africa/Cairo"
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - examples

  # Java SDK — Dependabot's security updates already opened PRs here (they need
  # no config), so the module only ever moved when an advisory forced it. This
  # adds the routine version updates that keep it from drifting in between.
  - package-ecosystem: maven
    directory: "/packages/idenplane-java"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "Africa/Cairo"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - java
    # Every artifact below is pinned individually in pom.xml rather than
    # inherited from a Spring BOM, so ungrouped Dependabot proposes them one at
    # a time — and a single artifact moving alone leaves the family skewed. The
    # first week of watching this directory produced exactly that:
    #   #1448 spring-boot-configuration-processor 3.5.4 -> 4.1.0, while
    #         autoconfigure / test / test-autoconfigure stay on 3.5.4
    #   #1445 spring-security-oauth2-resource-server 6.5.10 -> 7.1.0, while
    #         core / web / oauth2-jose stay on 6.5.x
    #   #1447 reactor-test 3.7.3 -> 3.8.6, while reactor-core stays 3.7.3
    # Split majors across one BOM are how you get a NoSuchMethodError that no
    # compile step catches. Grouping makes each family move as a unit — and
    # makes a major upgrade one reviewable PR instead of four that are only
    # correct together.
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
      spring-security:
        patterns:
          - "org.springframework.security:*"
      reactor:
        patterns:
          - "io.projectreactor:*"
      httpcomponents:
        patterns:
          - "org.apache.httpcomponents.client5:*"
          - "org.apache.httpcomponents.core5:*"
    ignore:
      # Spring Boot 4 and Spring Security 7 are a migration, not a bump, and
      # they are tracked in #1468. Grouping (above) did its job — it turned
      # them into two coherent PRs, #1463 and #1464 — and both fail `Java SDK`
      # for reasons that live in library code, not in the poms:
      #   Boot 4      removes TestRestTemplate; the sample's test won't compile
      #   Security 7  breaks the authorities mapping — a valid token stops
      #               producing ROLE_user (#1445, SpringBootSampleApplication
      #               Tests:89), which points at IdenplaneAuthoritiesConverter
      # This is an identity SDK: a wrong role-to-authority mapping still
      # returns 200 and still builds green, so it is not something to land on
      # a dependency sweep. Ignoring the majors keeps the same red PR from
      # being re-proposed every Monday while #1468 is open.
      # Minor and patch updates are untouched — 3.5.x and 6.5.x keep flowing,
      # which is how #1462 shipped the Artemis advisory fix.
      # DELETE THIS BLOCK as part of #1468.
      - dependency-name: "org.springframework.boot:*"
        update-types:
          - version-update:semver-major
      - dependency-name: "org.springframework.security:*"
        update-types:
          - version-update:semver-major
