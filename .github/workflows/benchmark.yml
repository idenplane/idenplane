name: Benchmark

# Load-tests the server built from the checked-out commit with k6 and reports
# throughput and latency per scenario. It fails only when a scenario's
# requests stop succeeding; latency on shared runners is reported, not gated.
# Competitor stacks (Keycloak, Authentik, Zitadel) are not started here.
on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    paths:
      - 'benchmarks/**'
      - '.github/workflows/benchmark.yml'

# Minimal default token permissions; jobs only read repo contents.
permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE: docker compose -f benchmarks/docker-compose.benchmarks.yml
  SCENARIOS: discovery jwks login
  VUS: '20'
  DURATION: 30s
  RAMP_UP: 5s

jobs:
  benchmark:
    name: Run Benchmarks & Generate Report
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Generate throwaway secrets
        run: |
          for name in ADMIN_API_KEY WEBHOOK_SECRET_KEY; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::${value}"
            echo "${name}=${value}" >> "$GITHUB_ENV"
          done
          for name in ADMIN_PASSWORD WEBHOOK_ENCRYPTION_SALT; do
            value="Bench-$(openssl rand -hex 16)"
            echo "::add-mask::${value}"
            echo "${name}=${value}" >> "$GITHUB_ENV"
          done

      - name: Build and start Idenplane (this commit)
        run: $COMPOSE up -d --build --wait app db

      - name: Seed the benchmark realm
        run: bash benchmarks/scripts/seed-benchmark-realm.sh

      - name: Run scenarios
        run: |
          mkdir -p benchmarks/results
          chmod 777 benchmarks/results   # the k6 image runs as a non-root user
          for s in $SCENARIOS; do
            echo "::group::$s"
            $COMPOSE run --rm \
              -e VUS -e DURATION -e RAMP_UP \
              -e REALM_NAME -e TEST_CLIENT_ID -e TEST_CLIENT_SECRET \
              -e TEST_USERNAME -e TEST_PASSWORD \
              k6 run --no-thresholds --summary-export "/results/$s.json" \
              "/src/k6/idenplane-$s.js"
            echo "::endgroup::"
          done

      - name: Report and check results
        run: node benchmarks/scripts/summarize-k6.mjs benchmarks/results $SCENARIOS

      - name: Show server logs on failure
        if: failure()
        run: $COMPOSE logs --tail 200 app

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ github.run_number }}
          path: benchmarks/results/*.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Teardown benchmark stack
        if: always()
        run: $COMPOSE down --volumes --remove-orphans
