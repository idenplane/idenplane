name: OpenID conformance

# Runs the OpenID Foundation conformance suite against the image built from
# this commit, every week:
#
#   oidcc-basic-certification-test-plan [server_metadata=discovery][client_registration=static_client]
#   oidcc-config-certification-test-plan
#
# The suite (its official image and run-test-plan.py, both from the pinned
# release), mongo, PostgreSQL, Idenplane and a Caddy TLS front with a
# throwaway CA run on one private Docker network: scripts/ci/conformance/run.sh,
# which also runs unchanged on a workstation.
#
# Fails when any module is FAILED, INTERRUPTED or did not run. WARNING and
# REVIEW (a screenshot a human must check for certification) are listed in
# the job summary but don't fail the job.
on:
  schedule:
    - cron: '9 4 * * 4' # Thursdays 04:09 UTC
  workflow_dispatch:
    inputs:
      plans:
        description: 'Plans to run (space-separated: basic, config)'
        default: 'basic config'
        type: string
  pull_request:
    branches: [main, dev]
    paths:
      - 'scripts/ci/conformance/**'
      - '.github/workflows/conformance.yml'

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: OIDC basic + config plans
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image from this commit
        run: docker build -t idenplane:conformance .

      - name: Run the conformance suite
        env:
          IDENPLANE_IMAGE: idenplane:conformance
          PLANS: ${{ inputs.plans || 'basic config' }}
          OUT_DIR: ${{ runner.temp }}/conformance-out
        run: bash scripts/ci/conformance/run.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-results
          path: ${{ runner.temp }}/conformance-out/
          retention-days: 30
