name: Unattended bootstrap (image)

# Builds the image from this commit and checks unattended bootstrap the way a
# Docker / Docker Compose deployment runs it (scripts/ci/bootstrap/run.sh):
# two containers on one empty database apply BOOTSTRAP_FILE exactly once, a
# restart changes nothing, and an invalid BOOTSTRAP_JSON stops the container
# before it is ready without writing anything. Needs only Docker; the same
# script runs on a workstation.
on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'src/bootstrap/**'
      - 'src/setup-wizard/**'
      - 'src/realms/**'
      - 'src/main.ts'
      - 'src/cluster.ts'
      - 'prisma/**'
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - 'scripts/ci/bootstrap/**'
      - 'scripts/ci/lib/**'
      - '.github/workflows/bootstrap-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Unattended bootstrap (image)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image from this commit
        run: docker build -t idenplane:bootstrap .

      - name: Bootstrap checks
        env:
          IDENPLANE_IMAGE: idenplane:bootstrap
        run: bash scripts/ci/bootstrap/run.sh
