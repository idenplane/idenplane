name: Publish idenplane-cli

# Publishes packages/idenplane-cli to npm as idenplane-cli (the `idenplane`
# command).
#
#   - every cli-v* git tag -> publishes, after checking the tag version
#     matches packages/idenplane-cli/package.json
#   - manual dispatch      -> on demand
#
# Authentication: npm trusted publishing (OIDC). The package's settings on
# npmjs.com name this repository and workflow file as its trusted publisher,
# so the job's GitHub OIDC token is exchanged for a one-time publish
# credential; no long-lived token is involved, and provenance is attached.
# NPM_TOKEN is only a fallback while a package has no trusted publisher yet.
on:
  push:
    tags: ['cli-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build & publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/idenplane-cli/package-lock.json
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Use npm with trusted publishing support
        run: npm install -g npm@11.6.2

      # idenplane-cli consumes @idenplane/http-internal through
      # `file:../idenplane-http-internal`, and its dist/ is gitignored — so on
      # a fresh checkout it has no compiled output to resolve. Build it first
      # (mirrors the identical step in ci.yml's SDK matrix job).
      - name: Build the local idenplane-http-internal dependency
        working-directory: packages/idenplane-http-internal
        run: |
          npm ci
          npm run build

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: packages/idenplane-cli
        run: |
          set -e
          TAG_VERSION="${GITHUB_REF_NAME#cli-v}"
          PKG_VERSION=$(node -p "require('./package.json').version")

          echo "Tag:          ${GITHUB_REF_NAME} (${TAG_VERSION})"
          echo "package.json: ${PKG_VERSION}"

          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error::Tag version (${TAG_VERSION}) does not match packages/idenplane-cli/package.json version (${PKG_VERSION})"
            exit 1
          fi

      - name: Install dependencies
        working-directory: packages/idenplane-cli
        run: npm ci

      - name: Typecheck
        working-directory: packages/idenplane-cli
        run: npm run typecheck

      - name: Build
        working-directory: packages/idenplane-cli
        run: npm run build

      - name: Test
        working-directory: packages/idenplane-cli
        run: npm test

      - name: Verify package contents
        working-directory: packages/idenplane-cli
        run: npm pack --dry-run

      - name: Publish to npm
        working-directory: packages/idenplane-cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
