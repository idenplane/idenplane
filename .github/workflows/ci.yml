name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Only the newest commit per branch is worth testing; superseded runs are
# cancelled so a burst of merges (e.g. clearing a Dependabot backlog) doesn't
# queue dozens of runs against commits that are already stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Minimal default token permissions; all jobs only read repo contents
# (checkout, install, test, build, upload-artifact). Elevate per-job if a
# future job needs write access.
permissions:
  contents: read

jobs:
  lint-and-unit-tests:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Unit Tests
        run: npm test -- --coverage --no-cache

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: idenplane_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: idenplane_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      # upgrade-backup-roundtrip.e2e-spec.ts exercises the real pg_dump /
      # pg_restore path — the only test that does; every unit test mocks the
      # shell. It skips itself when the binaries are absent, so install them
      # explicitly rather than relying on whatever the runner image happens to
      # ship: a silently skipped test here would leave the backup/restore
      # mechanics unverified while still reporting green.
      #
      # Ubuntu 24.04's postgresql-client is 16, matching the service container.
      # The client major must be >= the server's.
      - name: Install PostgreSQL client (for the backup round-trip spec)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
          pg_dump --version
          pg_restore --version

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://idenplane_test:test_password@localhost:5432/idenplane_test
        run: npx prisma migrate deploy

      - name: E2E Tests
        env:
          DATABASE_URL: postgresql://idenplane_test:test_password@localhost:5432/idenplane_test
          ADMIN_API_KEY: test-admin-key
          BASE_URL: http://localhost:3000
          NODE_ENV: test
        run: npm run test:e2e -- --no-cache

  admin-ui-tests:
    name: Admin UI Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json

      - name: Install admin-ui dependencies
        run: npm ci

      # `test` is `vitest run` and `test:coverage` is the same run with
      # --coverage, so running both executed every test twice for no extra
      # signal. Only the coverage variant is kept.
      - name: Run admin-ui tests with coverage
        run: npm run test:coverage

      - name: Upload admin-ui coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: admin-ui-coverage-report
          path: admin-ui/coverage/
          retention-days: 14

  sdk-integration-tests:
    # idenplane-mcp already had a real integration suite
    # (packages/idenplane-mcp/tests/integration.mjs) that probes for a live
    # Idenplane instance and silently skips itself when one isn't reachable —
    # which meant it had never actually run in CI. idenplane-js and
    # idenplane-go had no server-facing integration coverage at all: their
    # unit suites mock every HTTP call, so nothing ever checked that a
    # request either SDK builds actually matches what this server expects.
    # This job boots a real backend and runs all three against it.
    name: SDK Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: idenplane_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: idenplane_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://idenplane_test:test_password@localhost:5432/idenplane_test
      ADMIN_API_KEY: dev-admin-key
      NODE_ENV: test
      PORT: '3000'
      IDENPLANE_URL: http://localhost:3000
      IDENPLANE_ADMIN_TOKEN: dev-admin-key
      IDENPLANE_ADMIN_USER: admin
      IDENPLANE_ADMIN_PASSWORD: e2e-test-admin-password
      ADMIN_USER: admin
      ADMIN_PASSWORD: e2e-test-admin-password

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Build backend
        run: npm run build

      - name: Start backend
        run: |
          node dist/main.js > backend.log 2>&1 &
          echo "Waiting for backend on :3000/health..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "Backend is up."
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy in time."
          cat backend.log
          exit 1

      # mcp consumes @idenplane/http-internal through
      # `file:../idenplane-http-internal`, and its dist/ is gitignored — so on
      # a fresh checkout it has no compiled output to resolve. Build it first
      # (mirrors the same step in the sdk-packages job).
      - name: Build the local idenplane-http-internal dependency
        working-directory: packages/idenplane-http-internal
        run: |
          npm ci
          npm run build

      - name: idenplane-mcp integration suite
        working-directory: packages/idenplane-mcp
        run: |
          npm ci
          npm run build
          npm run test:all

      - name: idenplane-js integration suite
        working-directory: packages/idenplane-js
        run: |
          npm ci
          npm run test:integration

      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/idenplane-go/go.mod
          cache: false

      - name: idenplane-go integration suite
        working-directory: packages/idenplane-go
        run: go test -tags=integration -v ./...

  admin-ui-e2e:
    # The existing "E2E Tests" job drives the NestJS app in-process via
    # supertest — it never listens on a real port, so it can't catch bugs in
    # the admin console's own UI (routing, forms, the vite dev proxy). This
    # job boots a real backend and a real browser against it.
    name: Admin UI E2E Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: idenplane_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: idenplane_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://idenplane_test:test_password@localhost:5432/idenplane_test
      ADMIN_API_KEY: test-admin-key
      NODE_ENV: test
      PORT: '3000'
      DEMO_MODE: 'true'
      ADMIN_USER: admin
      ADMIN_PASSWORD: e2e-test-admin-password

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Build backend
        run: npm run build

      # AdminSeedService creates the master realm + ADMIN_USER/ADMIN_PASSWORD
      # on first boot (src/admin-auth/admin-seed.service.ts), and DEMO_MODE
      # makes the login page prefill those same credentials — no manual seed
      # step needed.
      - name: Start backend
        run: |
          node dist/main.js > backend.log 2>&1 &
          echo "Waiting for backend on :3000/health..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "Backend is up."
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy in time."
          cat backend.log
          exit 1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json

      - name: Install admin-ui dependencies
        working-directory: admin-ui
        run: npm ci

      - name: Install Playwright browsers
        working-directory: admin-ui
        run: npx playwright install --with-deps chromium

      - name: Start admin-ui dev server
        working-directory: admin-ui
        run: |
          npm run dev > vite.log 2>&1 &
          echo "Waiting for admin-ui on :5173..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173/console/login > /dev/null; then
              echo "admin-ui is up."
              exit 0
            fi
            sleep 2
          done
          echo "admin-ui did not become healthy in time."
          cat vite.log
          exit 1

      - name: Run Playwright tests
        working-directory: admin-ui
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: admin-ui/playwright-report/
          retention-days: 14

  sdk-packages:
    # Nothing built or tested these until now, so breakage sat unnoticed:
    # idenplane-angular had not compiled since Angular went ESM-only, and a
    # vue guard test asserted behaviour the guard had deliberately stopped
    # having. One job per package so a red square names the culprit.
    name: SDK — ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - idenplane-js
          - idenplane-vue
          - idenplane-angular
          - idenplane-nextjs
          - idenplane-mcp
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/${{ matrix.package }}/package-lock.json

      # vue, angular and nextjs consume idenplane-js through `file:../idenplane-js`,
      # and its dist/ is gitignored — so on a fresh checkout `idenplane-sdk` has no
      # type declarations to resolve and all three fail to typecheck. Build it first.
      - name: Build the local idenplane-js dependency
        if: matrix.package != 'idenplane-js' && matrix.package != 'idenplane-mcp'
        working-directory: packages/idenplane-js
        run: |
          npm ci
          npm run build

      # mcp consumes @idenplane/http-internal through
      # `file:../idenplane-http-internal`, and its dist/ is gitignored — so on
      # a fresh checkout it has no compiled output to resolve. Build it first.
      - name: Build the local idenplane-http-internal dependency
        if: matrix.package == 'idenplane-mcp'
        working-directory: packages/idenplane-http-internal
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      # idenplane-mcp splits its suites: `test` is the integration suite, which
      # skips itself without a live Idenplane instance, and `test:all` adds the
      # smoke test. The other four expose a single `test`.
      - name: Test
        run: npm run ${{ matrix.package == 'idenplane-mcp' && 'test:all' || 'test' }}

  go-modules:
    # No job in this workflow touched Go at all, so 35 tests in
    # packages/idenplane-go had never run and terraform-provider-idenplane had
    # never been compiled — it turned out not to.
    name: Go — ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - packages/idenplane-go
          - terraform-provider-idenplane
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7

      # Each module declares what it needs; a pinned number here goes stale the
      # first time a dependency bump raises one of them.
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: false

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  android-sdk:
    # packages/idenplane-android had real Kotlin source but no
    # settings.gradle.kts or Gradle wrapper, so it had never been compiled by
    # anything — not CI, not a local machine. (#1347/#1325)
    name: Android SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/idenplane-android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble (debug + release AAR)
        run: ./gradlew assembleDebug assembleRelease --stacktrace

  java-sdk:
    # packages/idenplane-java had real Java source (data models) but no CI job ever ran `mvn`
    # against it, so the multi-module reactor build had never actually been exercised — it
    # couldn't even resolve its POMs (idenplane-java-reactive referenced reactor-test with no
    # version). (#1326)
    name: Java SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/idenplane-java
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify (build, test, coverage gate)
        run: mvn -B verify

  examples-build:
    # Nothing ever built these — examples/nextjs-quickstart was silently
    # broken from the moment idenplane-sdk/idenplane-nextjs were published
    # without dist/ (#1343): its own package-lock.json kept resolving the
    # broken 1.0.1 even after 1.0.2 fixed the registry, and `npm run build`
    # failed outright with "Module not found". Found while investigating
    # unrelated Dependabot security alerts for this same example.
    name: Examples — ${{ matrix.example }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - nextjs-quickstart
          - vanilla-js-quickstart
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/${{ matrix.example }}/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Audit for known-vulnerable dependencies
        run: npm audit --audit-level=moderate

      # nextjs-quickstart has a real Next.js build; vanilla-js-quickstart has
      # no build step at all (that's the point of it), so just confirm the
      # SDK it depends on actually resolves to something with a dist/ in it.
      - name: Build (nextjs-quickstart only)
        if: matrix.example == 'nextjs-quickstart'
        run: npm run build

      - name: Verify the SDK resolved with a real dist/ (vanilla-js-quickstart only)
        if: matrix.example == 'vanilla-js-quickstart'
        run: test -f node_modules/idenplane-sdk/dist/index.js

  docs-build:
    # The docs site had been failing to build and nothing noticed, because no
    # job ever built it. Its dependency tree is separate from the root one, so
    # a bad resolution there is invisible to every other job here.
    name: Docs Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        run: npm ci

      - name: Build docs
        run: npm run build

  docker-build:
    # The publish workflow only runs after a merge to main, so until now a
    # Dockerfile change was never built while it could still be rejected — it
    # broke the published image instead. This builds the same Dockerfile on the
    # PR, without pushing anything.
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # amd64 only: the publish workflow also does arm64 through QEMU, which
      # roughly triples the build and is not worth it for a pre-merge check.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: idenplane:ci
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The upgrade feature shells out to these. They are installed in the
      # Dockerfile and their --version is asserted there, but that only proves
      # they existed at build time in that layer; this proves they are in the
      # final image and on PATH for the entrypoint.
      - name: Backup tooling present in the image
        run: |
          docker run --rm --entrypoint pg_dump idenplane:ci --version
          docker run --rm --entrypoint pg_restore idenplane:ci --version

  helm-chart:
    # 16 files that ship to anyone deploying on Kubernetes, and nothing had
    # ever linted or rendered them. values.schema.json in particular was being
    # validated against nothing at all.
    name: Helm Chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      # postgresql and redis are declared as dependencies. Their conditions
      # control whether they get installed, not whether helm needs them
      # present — without this, lint warns and template refuses outright.
      - name: Fetch chart dependencies
        run: helm dependency build helm/idenplane

      - name: Lint
        run: helm lint helm/idenplane

      # Rendering is what catches a template that only fails on a value it has
      # never been given. Both value files go through it, and helm validates
      # each against values.schema.json on the way.
      - name: Render with default values
        run: helm template idenplane helm/idenplane > /dev/null

      - name: Render with production values
        run: helm template idenplane helm/idenplane -f helm/idenplane/values.production.yaml > /dev/null

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-unit-tests, admin-ui-tests]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Build
        run: npm run build
