name: OpenSSF Scorecard

# Supply-chain security checks (pinned dependencies, token permissions,
# branch protection, signed releases, ...). Results go to the code-scanning
# tab as SARIF and are published to the public Scorecard API, which backs
# the badge in the README. Scorecard only evaluates the default branch (dev).
#
# It starts when "Gradle wrapper validation" (android-gradle-wrapper.yml)
# completes on dev, not on the push itself: Scorecard's Binary-Artifacts
# check only discounts the two gradle-wrapper.jar files when that workflow
# already has a successful run on the commit being scanned, and on push it
# never had one yet (alerts 86/87). That workflow runs on every push to dev
# and weekly, so this still runs for every dev commit and every week.
on:
  branch_protection_rule:
  workflow_run:
    workflows: ['Gradle wrapper validation']
    types: [completed]
    branches: [dev]
  workflow_dispatch:

# publish_results requires that no workflow-level permission is write.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    # A pull request from the dev branch (the dev -> main sync) that touches
    # the wrappers also completes that workflow with head branch dev; only
    # scan after the push and scheduled runs.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload the SARIF to code scanning
      id-token: write          # publish_results: sign the results
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # A fine-grained token limited to this repository with
          # Administration: read-only (and Metadata: read-only), so the
          # Branch-Protection check can read the branch rules; the default
          # GITHUB_TOKEN can't, and the check reported -1 ("internal error").
          # https://github.com/ossf/scorecard-action/blob/main/docs/authentication/fine-grained-auth-token.md
          # It can change nothing. Falls back to the default token if unset.
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}

      - name: Upload the results as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
