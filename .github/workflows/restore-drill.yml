name: Backup restore drill & upgrade test

# Weekly proof that the two things nobody exercises until they need them
# still work:
#
#   restore-drill  pg_dump -Fc of a seeded instance -> restore into a fresh
#                  PostgreSQL 16 -> start Idenplane on it with the same keys ->
#                  sign-in (password and TOTP), stored client secret, refresh
#                  token and signing keys must all still work; a different
#                  WEBHOOK_SECRET_KEY must be refused. (scripts/ci/restore-drill.sh)
#   upgrade        the previous release's published image with data, then the
#                  image from this commit on the same database and keys:
#                  migrations, sign-in and stored secrets. (scripts/ci/upgrade-test.sh)
#   pg-tools-e2e   the two e2e suites that drive the real pg_dump/pg_restore
#                  (upgrade-backup-roundtrip, upgrade-failure-rollback), with
#                  PostgreSQL 16 client tools and REQUIRE_PG_TOOLS so they can
#                  never skip silently.
#
# Also runs on PRs that touch migrations or the backup code, where an upgrade
# regression would start.
on:
  schedule:
    - cron: '41 2 * * 3' # Wednesdays 02:41 UTC
  workflow_dispatch:
    inputs:
      previous_image:
        description: 'Image to upgrade FROM (default: the latest v* tag before this commit)'
        required: false
        type: string
  pull_request:
    branches: [main, dev]
    paths:
      - 'prisma/migrations/**'
      - 'prisma/schema.prisma'
      - 'src/upgrade/**'
      - 'src/crypto/**'
      - 'src/secrets-at-rest/**'
      - 'docker-entrypoint.sh'
      - 'Dockerfile'
      - 'scripts/ci/drill/**'
      - 'scripts/ci/lib/**'
      - 'scripts/ci/restore-drill.sh'
      - 'scripts/ci/upgrade-test.sh'
      - '.github/workflows/restore-drill.yml'

permissions:
  contents: read

concurrency:
  group: restore-drill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  restore-drill:
    name: Backup -> restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image from this commit
        run: docker build -t idenplane:drill .

      - name: Drill
        env:
          IDENPLANE_IMAGE: idenplane:drill
          OUT_DIR: ${{ runner.temp }}/drill-out
        run: bash scripts/ci/restore-drill.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: restore-drill-logs
          path: ${{ runner.temp }}/drill-out/
          retention-days: 14

  upgrade:
    name: Upgrade from the previous release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The previous release is found from the tags reachable from HEAD.
          fetch-depth: 0

      - name: Build the image from this commit
        run: docker build -t idenplane:upgrade .

      - name: Upgrade test
        env:
          IDENPLANE_IMAGE: idenplane:upgrade
          PREV_IMAGE: ${{ inputs.previous_image }}
          OUT_DIR: ${{ runner.temp }}/upgrade-out
        run: bash scripts/ci/upgrade-test.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upgrade-test-logs
          path: ${{ runner.temp }}/upgrade-out/
          retention-days: 14

  pg-tools-e2e:
    name: pg_dump / pg_restore e2e suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: idenplane_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: idenplane_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://idenplane_test:test_password@localhost:5432/idenplane_test
      ADMIN_API_KEY: test-admin-key
      NODE_ENV: test
      NODE_OPTIONS: --max-old-space-size=6144
      REQUIRE_PG_TOOLS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Same as ci.yml: the client major must equal the server's (16).
      - name: Install PostgreSQL 16 client
        env:
          PG_MAJOR: '16'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends "postgresql-client-${PG_MAJOR}"
          echo "/usr/lib/postgresql/${PG_MAJOR}/bin" >> "$GITHUB_PATH"
          for tool in pg_dump pg_restore; do
            "/usr/lib/postgresql/${PG_MAJOR}/bin/${tool}" --version | tee /dev/stderr \
              | grep -q " ${PG_MAJOR}\." || { echo "::error::${tool} is not PostgreSQL ${PG_MAJOR}"; exit 1; }
          done

      - run: npx prisma migrate deploy

      - name: Backup round-trip and failure rollback
        run: >-
          npm run test:e2e -- --no-cache
          test/upgrade-backup-roundtrip.e2e-spec.ts
          test/upgrade-failure-rollback.e2e-spec.ts
