name: Publish idenplane-sdk

# Publishes packages/idenplane-js to npm as idenplane-sdk, the name the docs
# and examples install.
#
#   - every sdk-v* git tag -> publishes, after checking that the tag version
#     matches packages/idenplane-js/package.json (the same safety check
#     release-version-check.yml does for root v* tags)
#   - manual dispatch      -> on demand
#
# Authentication: npm trusted publishing (OIDC). The package's settings on
# npmjs.com name this repository and workflow file as its trusted publisher,
# so the job's GitHub OIDC token is exchanged for a one-time publish
# credential; no long-lived token is involved, and provenance is attached.
on:
  push:
    tags: ['sdk-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build & publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    defaults:
      run:
        working-directory: packages/idenplane-js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/idenplane-js/package-lock.json
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1 or later. Node 24.5.0 and later
      # bundle it, so check the bundled npm instead of installing an
      # unpinned one over it.
      - name: Check npm supports trusted publishing
        run: |
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) {
              console.error(`npm ${process.argv[1]} is older than 11.5.1, which trusted publishing needs`);
              process.exit(1);
            }
          ' "$(npm --version)"

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -e
          TAG_VERSION="${GITHUB_REF_NAME#sdk-v}"
          PKG_VERSION=$(node -p "require('./package.json').version")

          echo "Tag:          ${GITHUB_REF_NAME} (${TAG_VERSION})"
          echo "package.json: ${PKG_VERSION}"

          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error::Tag version (${TAG_VERSION}) does not match packages/idenplane-js/package.json version (${PKG_VERSION})"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --provenance --access public
