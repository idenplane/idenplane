name: Publish idenplane-sdk

# Publishes packages/idenplane-js to npm as idenplane-sdk, the name the docs
# and examples install.
#
#   - every sdk-v* git tag -> publishes, after checking that the tag version
#     matches packages/idenplane-js/package.json (the same safety check
#     release-version-check.yml does for root v* tags)
#   - manual dispatch      -> on demand
#
# Requires one repo secret:
#   NPM_TOKEN - an npm automation token with publish rights for idenplane-sdk.
on:
  push:
    tags: ['sdk-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build & publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/idenplane-js
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/idenplane-js/package-lock.json
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -e
          TAG_VERSION="${GITHUB_REF_NAME#sdk-v}"
          PKG_VERSION=$(node -p "require('./package.json').version")

          echo "Tag:          ${GITHUB_REF_NAME} (${TAG_VERSION})"
          echo "package.json: ${PKG_VERSION}"

          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error::Tag version (${TAG_VERSION}) does not match packages/idenplane-js/package.json version (${PKG_VERSION})"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
