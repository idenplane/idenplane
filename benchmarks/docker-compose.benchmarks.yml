services:
  # k6 load generator
  k6:
    image: grafana/k6:latest
    # Run on demand (`docker compose run --rm k6 ...`), not with `up`.
    profiles: [runner]
    container_name: idenplane-benchmark-runner
    depends_on:
      app:
        condition: service_healthy
    environment:
      - TARGET_URL=http://app:3000
      - ADMIN_API_KEY=${ADMIN_API_KEY:?Set ADMIN_API_KEY}
      - REALM_NAME=${REALM_NAME:-benchmark}
      - TEST_CLIENT_ID=${TEST_CLIENT_ID:-benchmark-client}
      - TEST_CLIENT_SECRET=${TEST_CLIENT_SECRET:-}
      - TEST_USERNAME=${TEST_USERNAME:-benchuser}
      - TEST_PASSWORD=${TEST_PASSWORD:-}
      - VUS=${VUS:-50}
      - DURATION=${DURATION:-60s}
      - RAMP_UP=${RAMP_UP:-10s}
    volumes:
      - ./k6:/src/k6
      - ./results:/results
    command: >
      run --config /src/k6/config.js
      --out json=/results/summary.json
      /src/k6/idenplane-login.js
    networks:
      - benchmarks

  # Idenplane application instance for benchmarking
  app:
    # Built from the checked-out source, so a run measures exactly that
    # commit. Set IDENPLANE_IMAGE to benchmark a published image instead.
    image: ${IDENPLANE_IMAGE:-idenplane-benchmark:local}
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: idenplane-benchmark-target
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://idenplane:idenplane@db:5432/idenplane
      PORT: "3000"
      NODE_ENV: production
      # Production refuses placeholder secrets, so these must be real.
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      WEBHOOK_SECRET_KEY: ${WEBHOOK_SECRET_KEY:?Set WEBHOOK_SECRET_KEY}
      WEBHOOK_ENCRYPTION_SALT: ${WEBHOOK_ENCRYPTION_SALT:?Set WEBHOOK_ENCRYPTION_SALT}
      # The global throttler would otherwise answer the load with 429s.
      THROTTLE_TTL: ${THROTTLE_TTL:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-1000000}
      # k6 reaches the app as http://app:3000; tokens must be issued for it.
      BASE_URL: ${BASE_URL:-http://app:3000}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - benchmarks

  # Database for benchmark target
  db:
    image: postgres:16-alpine
    container_name: idenplane-benchmark-db
    environment:
      POSTGRES_USER: idenplane
      POSTGRES_PASSWORD: idenplane
      POSTGRES_DB: idenplane
    ports:
      - "5433:5432"
    volumes:
      - pgdata-bench:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idenplane"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - benchmarks

networks:
  benchmarks:
    driver: bridge

volumes:
  pgdata-bench:
