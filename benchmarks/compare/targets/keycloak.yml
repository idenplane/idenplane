# Keycloak in production mode (`start`) on PostgreSQL 16, configured the
# way its container guide describes. Plain HTTP because the load generator
# sits on the same Docker network; no TLS on either side.
# Driven by benchmarks/compare/compare.sh; every knob comes from its env.
name: bench-keycloak

services:
  db:
    image: postgres:16-alpine
    cpuset: ${DB_CPUS}
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_DB: keycloak
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 2s
      timeout: 3s
      retries: 30

  target:
    image: ${KEYCLOAK_IMAGE}
    command: ["start", "--import-realm"]
    cpuset: ${TARGET_CPUS}
    mem_limit: ${TARGET_MEM}
    memswap_limit: ${TARGET_MEM}
    depends_on:
      db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # Password hashing stays at Keycloak's defaults here; the
      # keycloak-argon2-parity.yml overlay raises it to Idenplane's cost.
    volumes:
      - ${KEYCLOAK_IMPORT_DIR}:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:${PUBLIC_PORT}:8080"
      - "127.0.0.1:${HEALTH_PORT}:9000"
