{{- /*
Application keys: the initial admin password, the admin API key and the keys
that encrypt webhook secrets at rest.

Precedence per key: an explicit value in .Values.secrets, then the value already
stored in this Secret (so upgrades keep it), then a newly generated one. Helm
reads the stored value with `lookup`, which returns nothing under
`helm template`, Argo CD or Flux; those setups must use secrets.existingSecret,
or every render would generate new encryption keys.
*/ -}}
{{- include "idenplane.validateSecrets" . }}
{{- if not .Values.secrets.existingSecret }}
{{- $name := include "idenplane.keysSecretName" . }}
{{- $stored := dict }}
{{- with (lookup "v1" "Secret" .Release.Namespace $name) }}
{{- $stored = .data | default dict }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "idenplane.labels" . | nindent 4 }}
  annotations:
    # Deleting this Secret would replace the encryption keys on the next
    # install and leave stored webhook secrets unreadable.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key, $length := dict "ADMIN_API_KEY" 64 "ADMIN_PASSWORD" 32 "WEBHOOK_SECRET_KEY" 64 "WEBHOOK_ENCRYPTION_SALT" 32 }}
  {{- $explicit := index $.Values.secrets $key | default "" }}
  {{- if $explicit }}
  {{ $key }}: {{ $explicit | b64enc | quote }}
  {{- else if hasKey $stored $key }}
  {{ $key }}: {{ index $stored $key | quote }}
  {{- else }}
  {{ $key }}: {{ randAlphaNum $length | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- /*
  The previous encryption key, only while rotating it: rendered only when set
  explicitly, never generated nor kept from the stored Secret, so removing it
  from the values removes it here.
  */}}
  {{- range $key := list "WEBHOOK_SECRET_KEY_PREVIOUS" "WEBHOOK_ENCRYPTION_SALT_PREVIOUS" }}
  {{- $explicit := index $.Values.secrets $key | default "" }}
  {{- if $explicit }}
  {{ $key }}: {{ $explicit | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
