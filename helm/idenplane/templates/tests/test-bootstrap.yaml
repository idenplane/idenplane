{{- if .Values.bootstrap.enabled }}
{{- /*
  `helm test`: the instance was set up from configuration, so the setup
  wizard reports completed. Uses the admin API key from the same Secret the
  pods read it from.
*/}}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "idenplane.fullname" . }}-test-bootstrap"
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "idenplane.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wizard-closed
      image: busybox:1.36
      env:
        - name: ADMIN_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.existingSecret | default (include "idenplane.keysSecretName" .) }}
              key: ADMIN_API_KEY
      command:
        - sh
        - -c
        - |
          status="$(wget -q -O - --timeout=10 --header "x-admin-api-key: $ADMIN_API_KEY" \
            "http://{{ include "idenplane.fullname" . }}:{{ .Values.service.port }}/setup-wizard/status")" || exit 1
          echo "$status" | grep -q '"wizardCompleted":true' || { echo "setup wizard is not completed"; exit 1; }
          echo "setup wizard completed by bootstrap"
{{- end }}
