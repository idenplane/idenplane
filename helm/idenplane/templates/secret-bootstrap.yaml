{{- if and .Values.bootstrap.enabled (not .Values.bootstrap.existingSecret) }}
{{- /*
  The bootstrap file, built from bootstrap.realms. A Secret, not a ConfigMap:
  a realm document may hold secrets written inline. It is read only at the
  first start of a fresh instance.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "idenplane.bootstrapSecretName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "idenplane.labels" . | nindent 4 }}
type: Opaque
stringData:
  bootstrap.json: {{ dict "version" 1 "realms" (.Values.bootstrap.realms | default list) | toJson | quote }}
{{- end }}
