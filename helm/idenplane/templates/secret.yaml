apiVersion: v1
kind: Secret
metadata:
  name: {{ include "idenplane.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "idenplane.labels" . | nindent 4 }}
  annotations:
    # Helm will not diff secret values in plain text.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- /* The bundled database and Redis are wired in deployment.yaml from their own Secrets. */}}
  {{- if and (not .Values.postgresql.enabled) .Values.secrets.DATABASE_URL }}
  DATABASE_URL: {{ .Values.secrets.DATABASE_URL | quote }}
  {{- end }}
  {{- if and (not .Values.redis.enabled) .Values.secrets.REDIS_URL }}
  REDIS_URL: {{ .Values.secrets.REDIS_URL | quote }}
  {{- end }}
  {{- if .Values.secrets.REDIS_SENTINEL_HOSTS }}
  REDIS_SENTINEL_HOSTS: {{ .Values.secrets.REDIS_SENTINEL_HOSTS | quote }}
  {{- end }}
  {{- if .Values.secrets.REDIS_SENTINEL_NAME }}
  REDIS_SENTINEL_NAME: {{ .Values.secrets.REDIS_SENTINEL_NAME | quote }}
  {{- end }}
