apiVersion: v2
name: idenplane
description: A Helm chart for Idenplane — a self-hosted authentication service built with NestJS.
type: application
version: 0.2.0
appVersion: "0.6.0"

keywords:
  - idenplane
  - authentication
  - sso
  - oauth
  - oidc
  - saml
  - webauthn

home: https://github.com/idenplane/idenplane
sources:
  - https://github.com/idenplane/idenplane

maintainers:
  - name: Islamawad132
    url: https://github.com/Islamawad132

dependencies:
  - name: postgresql
    version: "16.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "20.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
