# Maven Wrapper — pins the Maven version this module builds with.
#
# Added so the Java SDK can be built and tested without a system-wide Maven
# install (see #1468: every verification attempt was costing a full CI round
# trip), and so CI and local builds use the same Maven rather than whatever
# the runner image ships that week.
#
# `distributionType=only-script` uses the JDK's own downloader — no wrapper
# jar committed to the repo, which is the shape Maven recommends since 3.3.
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip
